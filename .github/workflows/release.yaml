name: 'Release'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

jobs:
  release:
    name: 'Release'
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_OSS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_OSS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Release Please
        uses: release-please-oss/release-please-action@599c30aae1e6568bb6a4303384e77b8c4f4d7376 # v6.0.4
        id: release
        with:
          token: ${{ steps.token.outputs.token }}

  # Build without id-token so dependency install scripts can't mint a publish token.
  build:
    name: 'Build package'
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
      - name: Setup Node environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          package-manager-cache: false # no cache in release builds (cache poisoning)
      - name: Install NodeJS dependencies
        run: npm ci
      - name: Pack
        run: npm pack
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    name: 'Publish to npm'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      id-token: write # npm trusted publishing (OIDC), no NPM_TOKEN secret
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - name: Setup Node environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Publish
        run: npm publish ./*.tgz
